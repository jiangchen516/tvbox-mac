name: build-macos

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift build (release)
        run: swift build -c release

      - name: Swift test
        run: swift test

      - name: Make .app bundle
        run: bash scripts/make-app-bundle.sh

      - name: Upload TVBoxMac.app.zip
        uses: actions/upload-artifact@v4
        with:
          name: TVBoxMac.app.zip
          path: dist/TVBoxMac.app.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TVBoxMac.app.zip
          generate_release_notes: true
