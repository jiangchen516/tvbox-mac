name: build-macos

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift build (release)
        run: swift build -c release

      - name: Swift test
        run: swift test

      - name: Make .app bundle
        run: bash scripts/make-app-bundle.sh

      - name: Upload TVBoxMac.app.zip
        uses: actions/upload-artifact@v4
        with:
          name: TVBoxMac.app.zip
          path: dist/TVBoxMac.app.zip
